group: Disaggregated
depends_on: 
  - image-build
steps:
- label: Distributed NixlConnector PD accuracy (4 GPUs)
  key: distributed-nixlconnector-pd-accuracy-4-gpus
  timeout_in_minutes: 30
  working_dir: "/vllm-workspace/tests"
  num_devices: 4
  source_file_dependencies:
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/
    - tests/v1/kv_connector/nixl_integration/
  commands:
    - uv pip install --system -r /vllm-workspace/requirements/kv_connectors.txt
    # The default `nixl` wheel is the CUDA 12 build; force-reinstall the wheel
    # matching this image's CUDA major so the correct nixl_ep_cpp.so is installed
    # (mirrors the repair in docker/Dockerfile).
    - CUDA_MAJOR=$(python3 -c "import torch; print(torch.version.cuda.split('.')[0])") && uv pip install --system --force-reinstall --no-deps "nixl-cu${CUDA_MAJOR}"
    - bash v1/kv_connector/nixl_integration/config_sweep_accuracy_test.sh
